name: ✨ Atualizar animação do README

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-animation:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Baixar repositório
        uses: actions/checkout@v4

      - name: 🎨 Criar animação
        run: |
          mkdir -p assets

          cat > assets/api-flow.svg <<'EOF'
          <svg width="900" height="120" viewBox="0 0 900 120"
               xmlns="http://www.w3.org/2000/svg">

            <style>
              .box {
                fill: #161b22;
                stroke: #30363d;
                stroke-width: 2;
                rx: 12;
              }

              .text {
                fill: #f0f6fc;
                font-family: Arial, sans-serif;
                font-size: 18px;
                font-weight: bold;
              }

              .arrow {
                fill: none;
                stroke: #58a6ff;
                stroke-width: 3;
                stroke-dasharray: 10 10;
                animation: move 1.5s linear infinite;
              }

              @keyframes move {
                to {
                  stroke-dashoffset: -20;
                }
              }
            </style>

            <rect class="box" x="40" y="30" width="200" height="60"/>
            <text class="text" x="140" y="67" text-anchor="middle">
              🌐 Frontend
            </text>

            <path class="arrow" d="M250 60 H390"/>

            <rect class="box" x="400" y="30" width="200" height="60"/>
            <text class="text" x="500" y="67" text-anchor="middle">
              ⚡ FastAPI
            </text>

            <path class="arrow" d="M610 60 H750"/>

            <rect class="box" x="760" y="30" width="100" height="60"/>
            <text class="text" x="810" y="67" text-anchor="middle">
              🗄️ DB
            </text>

          </svg>
          EOF

      - name: 💾 Salvar animação
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/api-flow.svg
          git diff --cached --quiet || git commit -m "✨ Atualiza animação do README"
          git push
